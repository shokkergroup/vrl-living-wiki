<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#06131f">
    <title>HLRN Living Wiki Has Moved</title>
    <link rel="canonical" href="https://shokkergroup.github.io/hlrn/">
    <meta http-equiv="refresh" content="0; url=https://shokkergroup.github.io/hlrn/">
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #06131f;
        color: #edf8ff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }

      main {
        max-width: 42rem;
        padding: 2rem;
      }

      a {
        color: #5de1ff;
      }
    </style>
    <script>
      (() => {
        const destination = new URL("https://shokkergroup.github.io/hlrn/");
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>HLRN has moved to its own site.</h1>
      <p>
        Continuing to
        <a href="https://shokkergroup.github.io/hlrn/">the standalone HLRN Living Wiki</a>.
      </p>
    </main>
  </body>
</html>
